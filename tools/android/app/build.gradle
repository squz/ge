plugins {
    id 'com.android.application'
}

android {
    namespace "com.squz.player"
    compileSdk 35

    defaultConfig {
        applicationId "com.squz.player"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
            // Prefer NDK r28+ so packaged libc++_shared is 16 KB-aligned
            // (r27 ships 4 KB-aligned STL; Android 16 dialog names it).
            // Linker flag for our own .so's is in CMakeLists (🎯T75).
        }

        externalNativeBuild {
            cmake {
                // c++_static avoids packaging NDK libc++_shared.so entirely —
                // that prebuilt is the third lib the system dialog listed when
                // we used c++_shared under NDK r27. Our .so's still get
                // -Wl,-z,max-page-size=16384 from CMakeLists.
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    // Pin a 16 KB-capable NDK when several are installed (AGP may pick r27).
    ndkVersion "29.0.14206865"

    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("local.properties")
            if (propsFile.exists()) props.load(propsFile.newDataInputStream())
            storeFile rootProject.file(props.getProperty("RELEASE_STORE_FILE", "/dev/null"))
            storePassword props.getProperty("RELEASE_STORE_PASSWORD", "")
            keyAlias props.getProperty("RELEASE_KEY_ALIAS", "")
            keyPassword props.getProperty("RELEASE_KEY_PASSWORD", "")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // Include SDL3 Java sources from vendor
    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                "${rootDir}/../../vendor/github.com/libsdl-org/SDL/android-project/app/src/main/java"
            ]
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
