# Verify tip does not reintroduce committed prebuilt binaries.
#
# Phase 1 LFS exit: archives are local-only (make prebuild / ensure-prebuilt).
# This gate fails if any prebuilt/**/*.a (or related binary patterns) is
# tracked in the tree. cook.json / manifest.json may remain as plain text.
#
# Pairs with scripts/hooks/pre-commit (rejects staging those paths).

name: Verify prebuilts

on:
  pull_request:
    paths:
      - 'prebuilt/**'
      - '.gitattributes'
      - '.gitignore'
      - 'tools/verify-prebuilds.py'
      - 'scripts/hooks/pre-commit'
      - '.github/workflows/verify-prebuilds.yml'
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (no submodules, no LFS)
        uses: actions/checkout@v6
        with:
          submodules: false
          lfs: false

      - name: Reject committed prebuilt binaries
        run: python3 tools/verify-prebuilds.py
