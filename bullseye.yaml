      Adjacent shipped features that are NOT this: 🎯T88 (background render pause — lifecycle-driven), 🎯T111 (onMetrics — adapts quality, still renders every frame), 🎯T132 (the primitive — setContinuousRendering/requestRedraw + idle-block + skip, shipped v0.68.0), 🎯T134 (sensor streams don't force redraws, shipped v0.69.0). T132/T134 are the achieved foundation this subgraph builds on. Original pre-decomposition discussion lived only in a ge Codex session (2026-06-01, mnemo-unindexed); this target + subgraph are the canonical record going forward.
