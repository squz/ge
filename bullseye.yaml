    - 'CLAUDE.md''s ''Server/player architecture'' section is rewritten to describe the new shape: ge apps can run in either server mode (headless, encoding for streaming) or windowed mode (rendering locally); the player happens to be a ge app whose onRender blits a video texture and whose app code handles the wire/decoder. The ''two parallel rendering frameworks'' framing goes away.'
    context: |-
      Filed 2026-04-26: the player is currently a bespoke app (tools/player.cpp + per-platform entry points + src/render/PlayerRender.cpp + a SDL_Renderer video path + its own tilt-composite + event mapping). The insight: that's plumbing ge already gives every other consumer (window, frame loop, render backend, tilt composite, event delivery, per-platform mobile builds). The player is just another ge app whose onRender draws a video texture and whose app code manages the wire + H.264 decoder. So: the player's main() becomes a thin ge::run(Factory) app like sample/tiltbuggy; the bespoke surfaces (network, decoder, wire framing, pairing, upstream-event forwarding) stay as the player's app code; the per-platform bootstrap + PlayerRender.cpp + the SDL_Renderer path are deleted; the tilt composite stops being duplicated with DirectRenderHost; the T32 YUV upload lives in the player's onRender. Non-goals: ge gains NO 'player mode' (ge::run unchanged); the wire/decoder/connection logic is NOT moved into ge. Relations: T7 (AudioPlayer dormancy resolves), T11 (pigeon — player picks up whatever transport ge surfaces), T30 (player consumes ge via add_subdirectory like tiltbuggy), T32 (YUV path lands natively). Sequencing: large refactor, best after the T33 test infra, before pigeon.

      UPDATE 2026-06-30 (the bgfx purge, a separate PR): **bgfx is now fully removed from the repo** — the bgfx/bx/bimg vendor submodules, lifted headers/{bgfx,bx,bimg}, the ShaderC binaries, the NOTICES entries, and the upstream-bgfx plan are gone, and the brokered/wire path (ServerWireBridge, SessionHost_brokered) is stubbed bgfx-free with 🎯T34 markers. So T34 no longer contains ANY 'remove bgfx' work. The acceptance below predates 🎯T38 (the sokol migration, since done) and is written in bgfx terms — read every 'bgfx' there as the sokol_gfx reality: the player's render is a sokol offscreen Pass + texture upload (not a 'bgfx textured-quad pass'); ge owns the SokolContext (not a 'bgfx context'); the server-side encode reads the frame back via SokolContext::captureFrameRGBASync — the headless sokol render+readback already built for 🎯T124 — instead of a bgfx framebuffer blit/readTexture. T34's remaining scope is therefore: (1) wire that existing sokol readback into the stubbed ServerWireBridge encode path (the WireWriter / VideoEncoder / wire-protocol / Context logic there is intact and bgfx-free), (2) construct a headless SokolContext in SessionHost_brokered's run loop (the BgfxContext slot is stubbed to a `renderInited` bool), (3) port the player main()/entry-points to a regular sokol ge app and delete the bespoke surfaces per the acceptance. PlayerRender.h's 'no bgfx' comment is already reworded.
