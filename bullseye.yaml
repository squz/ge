  T122:
    name: GlobeController drag-to-rotate is coordinate-system-agnostic (arcball), not hardwired Z-up
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 3.0
    acceptance:
    - 'GlobeController gives intuitive trackball rotation for ANY camera orientation: horizontal swipe rotates the globe about the on-screen vertical axis, vertical swipe about the on-screen horizontal axis — verified for both a Z-up consumer (tiltbuggy: camera at (0,-3,0), view axis -Y) and a Y-up consumer (esfera: camera at (0,0,+d), up +Y).'
    - 'The hardcoded Z-up axes are gone: DampedRotation::applyDrag no longer maps horizontal drag to world Z (0,0,1), and GlobeController''s pinch-twist no longer hardcodes {0,1,0}. Rotation axes derive from the camera/view basis (screen-right, screen-up, screen-normal) supplied by the consumer.'
    - 'Preferred implementation is arcball: a drag computes a SINGLE quaternion from two virtual-sphere points (map press + current normalized screen coords onto z=sqrt(1-x^2-y^2), q = {axis = a x b, w = a . b}), so the point under the finger stays under the finger — exact, not the small-angle two-rotation Euler approximation.'
    - Pinch-twist axis is the camera view axis (derived), not a literal.
    - tiltbuggy still rotates correctly (no regression); a Y-up consumer no longer sees horizontal swipes spin CW/CCW around the screen-normal.
    - Either GlobeController takes the camera basis / up+right axes at construction or per-frame, or the arcball path takes the view matrix — consumer passes its actual camera, no per-app axis literals.
    context: |-
      Surfaced by the esfera2 ge v0.61 port (esfera2-audit). ge/include/ge/GlobeController.h + DampedRotation.h bake in a Z-up convention: DampedRotation::applyDrag maps horizontal drag (dx) to a rotation about world Z {0,0,1} and vertical drag (dy) about X {1,0,0}; GlobeController's two-finger twist rotates about {0,1,0}. The inline comment even says "our camera is at (0,-3,0) looking at origin in Z-up, so the view axis is -Y" — i.e. it's written for the tiltbuggy sample.

      esfera uses a Y-up camera (eye at (0,0,+camera_dist), up +Y, looking -Z), so the correct mapping is dx -> Y {0,1,0}, dy -> X {1,0,0} (and twist about Z). With GlobeController, horizontal swipes instead spin the globe CW/CCW about the screen-normal — visibly wrong. The pre-migration esfera app never used GlobeController; it drove DampedRotation directly with the Y-up axes (see esfera2-webgpu src/main.cpp ~lines 2123-2127 and the twist at ~2050).

      The coordinate dependence collapses to a single rotation: the camera's view-basis. The {0,1,0}/{1,0,0} literals are just that basis's up/right columns for the Y-up camera; the Z-up app's up column is {0,0,1}. So the two conventions differ by exactly the relative orientation of the two cameras. Folding the basis in (or going full arcball from press/current screen points) makes GlobeController reusable for both without per-app axis literals.

      Until this lands, esfera2 bypasses GlobeController and replicates the old app's direct Y-up DampedRotation handling (app-side fix on branch upgrade-ge-v0.61). Related: ge T120 (SDL window orientation). Reference for the arcball math + the camera-basis factoring is in the esfera2 session discussion.
    tags:
