  T66:
    name: ge installs a cross-platform spdlog sink so SPDLOG_INFO surfaces uniformly on iOS, Android, and desktop
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - '`ge::log::install(std::string subsystem = "")` is called once per session host from `ge::run`, before any logging happens. Empty `subsystem` auto-detects: CFBundleIdentifier on iOS, package name on Android, argv[0] basename on desktop.'
    - 'On iOS the installed sink emits each spdlog `log_msg` through `os_log_*` with a named logger created from `os_log_create(<subsystem>, <logger-name>)` (logger-name defaults to "ge" or the spdlog logger''s own name). The fully-formatted spdlog payload is passed as a single `%{public}s` argument so every value is visible — no per-call `%{public}` boilerplate in app code. spdlog level maps to OS_LOG_TYPE: trace/debug → DEBUG, info → INFO, warn → DEFAULT, error → ERROR, critical → FAULT.'
    - On Android the installed sink emits each spdlog `log_msg` through `__android_log_print` with priority mapped from spdlog level (trace/debug → VERBOSE/DEBUG, info → INFO, warn → WARN, error → ERROR, critical → FATAL) and tag = subsystem (truncated to 23 chars per Android's TAG limit).
    - On desktop the sink keeps the existing stderr behaviour (spdlog's default colour sink); no regression in current ge / app log output during local dev.
    - Existing consumer apps (multimaze2, tiltbuggy, sample/tiltbuggy) require **zero source changes** to benefit. Every existing `SPDLOG_INFO` / `SPDLOG_WARN` / `SPDLOG_ERROR` / `SPDLOG_DEBUG` call now flows to the platform-native channel as well as stderr.
    - 'Verified end-to-end on a real iPhone (Minicades Test iPhone, iOS 26.4.2): a `SPDLOG_INFO("hello")` in a consumer app produces a line visible to `spyder log <udid> --process <BundleExecutable>` (and `--subsystem <bundle-id>`) without the app touching `os_log_create` itself.'
    - 'Verified end-to-end on a real Android device (Galaxy S24): same `SPDLOG_INFO` produces an `adb logcat` entry under the bundle-id tag.'
    - 'Documented in `ge/CLAUDE.md` under the Public API section: `ge::log::install`, the platform fan-out table (spdlog level → native level for each OS), and the bundle-id auto-detection rules.'
    - Old per-app workarounds (multimaze2's `os_log_create("com.squz.multimaze2", "T17")` block in src/Application.cpp from the 🎯T17 instrumentation push) can be deleted and replaced with the normal `SPDLOG_INFO` macro; the resulting messages still surface to `spyder log`.
    context: |-
      **Why this needs to be in ge, not in every app.**

      Getting `SPDLOG_INFO` output off an iOS device is currently a multi-day reverse-engineering puzzle that every consuming game would otherwise have to solve independently. The gauntlet (as discovered during multimaze2's 🎯T17 instrumentation work on 2026-05-17 → 2026-05-19):

      1. Apple has deprecated three logging APIs in sequence (NSLog → ASL syslog → unified log / `os_log`) without retiring any. Each has different visibility, capture paths, and filters.
      2. Privacy-by-default since iOS 14: `os_log` arguments are `<private>` unless every format specifier carries `%{public}`. Entries logged via `OS_LOG_DEFAULT` (no named subsystem) are filtered out of remote capture entirely. Code "works" silently while emitting nothing visible.
      3. Off-device capture is community-reverse-engineered. Apple's blessed answer is Xcode Console over USB — useless for automation. Spyder routes through go-ios's `os_trace_relay` service (the OSLog channel Xcode Console uses), but only sees entries from named loggers created by `os_log_create(<subsystem>, <category>)`.
      4. No mainstream cross-platform logging library (spdlog, glog, fmt) bundles an iOS sink that does the right thing. spdlog's default stderr sink is invisible on iOS.

      The exact incantation that works (proven during the 🎯T17 push):
      - Create a logger once with `os_log_create("com.squz.multimaze2", "T17")` at file scope.
      - Emit with `os_log(logger, "fmt %{public}d %{public}s", ...)` — every arg public.
      - Capture from host: `spyder log <udid> --process <CFBundleExecutable> --follow` (range queries are 5-second live windows on iOS so `--follow` is required for ad-hoc captures).

      That incantation is what `ge::log` needs to encode once. The "format spdlog message → single `%{public}s` arg" trick (pass the already-rendered payload string as a public argument so Apple's privacy filter never has to inspect individual values) means consumer code keeps writing normal `SPDLOG_INFO("v={:.3f} mass={:.4f}", v, m)` calls with no platform-specific annotation.

      Android side (`__android_log_print`) is much simpler — included for completeness so consumer apps don't have to wire that separately.

      Discovered while instrumenting multimaze2's 🎯T17 (ball-strike audio calibration). The level-1 marble-hit telemetry could not be retrieved from the iPhone for ~2 days because `OS_LOG_DEFAULT` was being filtered. Until ge encodes this, the next ge consumer will lose the same time.

      **Out of scope for this target**:
      - Log shipping (writing to a remote backend) — local-device capture only.
      - Crash reports — separate channel; spyder's `crashes` subcommand handles that.
      - Hot-reloadable log levels — current spdlog runtime level setting is sufficient.

      Spyder-side improvements that would make this even nicer (tracked as separate targets in marcelocantos/spyder, not blockers for this work):
      - Fix `spyder log --bundle-id <id> --follow` (currently EOFs immediately on iOS 26.4 — the `--process` path works as a workaround).
      - Server-side managed capture sessions (`log_capture_start` / `log_capture_stop` MCP tools) so agents don't have to wrangle `--follow` + background processes + kill via shell.
      - Document the "named subsystem required" constraint so consumers know what they're committing to.
    tags:
    - log
    - ios
    - android
    - spdlog
    - engine
    - dev-experience
    origin: manual
    discovered: 2026-05-19
    achieved: 2026-05-19
  T67:
    name: ge::iap supports explicit per-product SKU mappings so legacy / non-conformant SKUs can be registered without forcing them to fit the bundle-id-prefix convention
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - '`ge::iap::Product` (or its companion type in `<ge/iap.h>`) accepts an *optional* per-platform SKU mapping. When set, it overrides the auto-prefix path; when unset, current bundle-id-prefix behaviour is preserved unchanged. Shape sketch: `Product { id; type; std::optional<SkuMapping> sku; }` where `SkuMapping` carries `apple` and `android` strings (and is free to grow if a third platform lands).'
    - Both the StoreKit (Apple) and Play Billing (Android) backends honour the override. When `sku` is set, the platform-side identifier sent to StoreKit / Play Billing is the explicit string verbatim; when unset, the platforms continue to compute `bundle_id + "." + local_id` as today.
    - 'Consumer-facing surface remains source-compatible: existing call sites that use `setCatalogue({{.id="pro", .type=NonConsumable}})` keep working without change. Adding `sku = SkuMapping{.apple = "com.legacy.app.pro", .android = "legacy_pro"}` is purely additive.'
    - '`testing::setOwned(local_id, bool)` still operates against the local id, not the platform SKU — the testing API doesn''t leak the mapping mechanic.'
    - '`StubStore` ignores the mapping entirely (entitlements indexed by local id), since the stub doesn''t talk to any platform store.'
    - 'Documentation in `ge/CLAUDE.md` under the IAP section explains the two cases: greenfield apps (no `sku` field, auto-prefix is right) and legacy / migration apps (explicit `sku` per platform). Includes the multimaze2 worked example: legacy v2.0.2 SKUs `com.squz.multimaze.{grandmaster,kids,master,multiball}.001` and `com.squz.multimaze.allpacks` registered from a `com.squz.multimaze2` bundle without bundle-id rewriting.'
    - 'Unit test asserts both code paths: a `Product` without `sku` resolves through the auto-prefix on AppleStore / AndroidStore, and a `Product` with `sku` resolves through the explicit string. Verified against StubStore for the local-id path and against a mock platform store (or `iap_test.cpp`''s equivalent harness) for the explicit-SKU path.'
    - Cross-platform consumers can leave `sku.apple` or `sku.android` empty (default-constructed string) to indicate "use the auto-prefix on that platform only" — useful for apps where one platform inherits legacy SKUs and the other is greenfield. Documented in the example.
    context: |-
      **Surfaced by:** multimaze2 🎯T13 (iOS in-app purchase flow restored, anchored to legacy v2.0.2's product structure). multimaze2 wants to register `com.squz.multimaze.allpacks` and the four per-pack SKUs (`com.squz.multimaze.{grandmaster,kids,master,multiball}.001`) — but multimaze2's bundle id is `com.squz.multimaze2`, so ge's current auto-prefix mechanism would produce `com.squz.multimaze2.allpacks` (the wrong namespace). Either ge gains an explicit-SKU escape hatch, or multimaze2 abandons legacy SKU parity (which has near-zero value since the v2.0.2 app was pulled from sale years ago, but the *generality* of "ge consumers might rebrand or migrate bundles" is what motivates fixing this in the engine).

      **Why mapping, not a single `explicit_sku` field:**
      - iOS and Android have different valid-character rules. Apple allows dots in product IDs; Google Play forbids them in places (`-` and `.` get rejected in some test SKU formats). A single string can't represent both correctly when the rules diverge.
      - Apps can rebrand on one platform without the other (iOS bundle changes, Android keeps its old package name, or vice versa). A mapping struct expresses this directly.
      - Treats both auto-prefixed and explicit-SKU products as first-class catalogue entries rather than "normal product" + "weird-case escape hatch".

      **Design intent of the current `bundle_id + \".\" + local_id` auto-prefix** (worth preserving as the default):
      1. Cross-platform parity for free — same local id maps to a consistent SKU on both stores.
      2. Codifies Apple's informal `<bundle-id>.<product>` convention (avoids collisions across a developer team's apps, since App Store Connect product IDs are team-scoped, not app-scoped).
      3. Sandbox / TestFlight builds with different bundle ids automatically point at matching sandbox SKUs without `#ifdef`s.

      All three benefits are preserved when `sku` is unset — only consumers that explicitly need the override pay the cost of providing it.

      **Out of scope:** runtime-overridable SKU mapping (the mapping is fixed at catalogue-registration time, not mutable later). Per-locale SKUs (Apple supports this via App Store Connect's metadata; ge already exposes it via `LocalisedProduct.price`). Subscription-product SKU variants per renewal tier (subscriptions are a wider design conversation; consume the single `Product` row for now).

      **Companion target in multimaze2:** 🎯T13 depends on a working ge::iap surface; once this target lands, T13 can register its five products with explicit Apple SKUs and unblock the iOS v1 launch. T13 has been written to assume ge::iap will gain this capability; if for any reason it doesn't, T13 has a documented fallback (register fresh SKUs under `com.squz.multimaze2.*` and accept loss of legacy-customer entitlement continuity — moot since v2.0.2 was pulled from sale).
    tags:
    - iap
    - engine
    - api
    - surfaced-by:multimaze2
    origin: manual
    discovered: 2026-05-21
    achieved: 2026-05-21
  T68:
    name: ge::iap Apple backend migrates to StoreKit 2 for silent auto-restore + on-device JWS verification
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - '`ge::iap`''s Apple backend (currently `iap_apple.mm` using StoreKit 1''s `SKPaymentQueue` / `SKProductsRequest`) is replaced or supplemented by a StoreKit 2 implementation. Switch is transparent to consumers — same `setCatalogue` / `owned` / `buy` / `restore` surface, same `Product` / `SkuMapping` / `Result` types.'
    - On consumer-app launch, ge::iap silently picks up any unfinished or restored transactions via StoreKit 2's `Transaction.updates` async stream without requiring a user gesture. `iap::owned()` returns the correct entitlement state within a frame or two of process start — no need for the user to tap Restore Purchases unless they actually want to.
    - ge::iap exposes (or internally uses) StoreKit 2's `Transaction.currentEntitlements` to populate the entitlement cache on startup. New consumer-facing query equivalent to 'what does this account own right now' returns immediately from cache after the first `currentEntitlements` walk.
    - On-device JWS signature verification via `VerificationResult.verified` replaces SK1's framework-implicit verification. Only `verified` entitlements are written to the cache; `unverified` results log a warning and are ignored.
    - Swift bridge is documented in `ge/CLAUDE.md` — how the `.swift` file integrates into the Obj-C++ build, what `@objc` bridging looks like, and how to add new SK2 surface without touching every consumer. Ideally the bridge is a single `iap_apple.swift` (or similar) compiled alongside `iap_apple.mm`, with C++ exposed via `extern "C"` shims.
    - Existing Restore Purchases path continues to work (Apple App Review §3.1.1 still requires the visible affordance regardless of silent-restore capability). `ge::iap::restore()` keeps its current semantics; consumers don't need to change.
    - Unit tests in `iap_test.cpp` continue to pass against StubStore (which doesn't change). New tests cover the SK2-specific paths against a `MockAppleStore` or similar that simulates Apple-side transactions.
    - Documentation in `ge/CLAUDE.md` IAP section updated to explain the SK1 → SK2 migration, what consumers gain (silent restore + JWS verification), and how to opt out for apps still on iOS 14 (unlikely to matter for new ge games).
    context: |-
      **Surfaced by:** multimaze2's 🎯T13 work uncovered a UX wart — the Restore Purchases button is the only place where users can pull entitlements they previously purchased but the device doesn't know about. With StoreKit 1 there's no API to query 'what do I own?' without invoking restore, so the button has to be both prominently visible AND manually tapped on every new device install. StoreKit 2 (iOS 15+) ships `Transaction.updates` + `Transaction.currentEntitlements` which let an app silently auto-restore at launch and know its entitlement state without any user gesture.

      **Why this is a ge target, not a per-app one:** every ge consumer that ships paid content (multimaze2, future games) faces the same StoreKit 1 limitations. Adding a one-time Swift bridge to ge::iap pays off across the whole game portfolio.

      **Why the current ge::iap is on StoreKit 1:** the iap_apple.mm file explicitly notes the choice: *"Uses StoreKit 1 (the Obj-C-compatible API) so this compiles in the existing Obj-C++ codebase without introducing a Swift toolchain dependency."* The future-work paragraph also acknowledges JWS verification as a 'future migration when subscriptions ship'. This target is the migration.

      **Apple App Review §3.1.1** still requires a visible Restore Purchases affordance regardless of backend capability, so SK2 doesn't let us remove the button. The win is purely silent-auto-restore-on-launch (better UX) and on-device JWS verification (no server-side validation needed for paid non-consumables).

      **Out of scope:** subscription products, refund handling, family-sharing entitlements — file separate targets when those are needed. The SK1 → SK2 migration is purely about non-consumable IAP lifecycle.

      **Build-system impact:** ge's iOS build path needs Swift toolchain enabled. Existing consumers shouldn't see any change in their CMake/Module.mk if ge handles the Swift integration internally.

      **Implementation sketch:** new `iap_apple.swift` file with `@objc public class StoreKit2Bridge` exposing async-to-callback C-compatible methods. `iap_apple.mm` keeps the C++ `AppleStore : Store` adapter but routes the underlying calls through `StoreKit2Bridge` instead of SKPaymentQueue. Existing `Product::sku` SkuMapping mechanic carries over unchanged — SK2 takes the same string IDs.
    tags:
    - iap
    - engine
    - apple
    - storekit2
    - surfaced-by:multimaze2
    origin: manual
    discovered: 2026-05-23
    achieved: 2026-05-24
