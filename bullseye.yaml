  T146:
    name: ge has evaluated arena / ZII / group-lifetime memory patterns against its real architecture and adopted the ones that fit, each accepted idea filed as a concrete target
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: 'Plateau P: memory-pattern spike; post-P engine research.'
    acceptance:
    - 'A written evaluation (this target''s context or a docs/ note) scores each of four candidate applications against ge''s ACTUAL code with a keep / defer / reject verdict + rationale: (1) a named ''zero-stub'' ZII convention; (2) a per-frame CPU arena on Context; (3) a per-session State arena folded into T99; (4) a handle-based sprite/texture pool as the N+1 for T135''s per-element Sprite RAII.'
    - 'The ZII zero-stub convention is decided: whether ge''s existing de-facto behaviour (Sprite{} / isNull() no-op draw, loadImage / rasterizeSvg / rasterizeText returning Sprite{} on failure, makePass(nullptr) no-op Pass, wire-mode zeroed Context) becomes a documented AGENTS.md design principle, and which remaining factories need auditing to conform.'
    - The per-frame-arena win is sized with a CHEAP measurement of per-frame heap churn in the render loop today (SpriteBatch::quads_ reallocation, the ge::debug primitive vectors, transient rasterizeText sprites), so the decision is evidence-based rather than aesthetic.
    - 'The tension with T135 is confronted head-on (Sprite RAII IS the Stage-N per-element ownership the source argues against): the handle-based pool is either scoped as T135''s deliberate N+1 evolution with the triggering consumer named (e.g. multimaze2''s many menu sprites), or explicitly deferred with rationale.'
    - Every 'keep' verdict spawns a concrete follow-on target (or folds into an existing one — e.g. the State arena into T99); every 'defer'/'reject' records why in this target's context. No accepted idea is left as loose prose.
    context: |-
      Sourced from Casey Muratori's "Smart-Pointers, RAII, ZII? Becoming an N+2 programmer" (YouTube xt1KNDmOYqA; note at ~/think/knowledge/youtube/xt1KNDmOYqA/memory-arenas-over-smart-pointers.md). Thesis: arenas / group-lifetime over per-element new/delete; per-frame arenas; growable-arena + stub failure handling; and ZII (Zero Is Initialization) — all-zeros is a valid no-op default, so a failing factory returns a zero-stub the caller uses blindly instead of throwing, deleting large amounts of error-handling code.

      Why a spike, not an implementation: ge is already structurally closer to N+1 than typical C++ — pImpl (single-owner, not a pointer web), handle-based sokol (sg_image/sg_view are {uint32_t id}), value types, and the render = f(State) direction (🎯T99 / 🎯T124 / 🎯T131.4) — and it already does ZII-on-failure in several places without naming it. The Stage-N residue is real but narrow: per-element GPU-resource ownership (🎯T135 just gave ge::Sprite RAII — the exact anti-pattern the talk targets) and per-frame vector churn (SpriteBatch, ge::debug). So the right first move is to evaluate the four candidate applications against ge's actual code + a cheap measurement, keep what fits, and spawn concrete targets for the keepers — not a rewrite.

      The caveat to honour so this doesn't become a de-RAII crusade: ge is C++ consumed by other teams, and RAII over a single external resource with an obvious owner (ge::Pass, ge::audio::Registration, the pImpls) is the legitimate use the talk does NOT object to — it stays. The win is selective: transient / frame data → arena; recoverable failure → ZII stub; grouped lifetimes → State / session arena. Filed from a design discussion 2026-07-04.

      Related: 🎯T99 (ge::app&lt;State&gt;), 🎯T124 (render = f(State)), 🎯T131.4 (State-diff render-on-demand), 🎯T135 (Sprite RAII).
    tags:
