  T94:
    name: ge exposes a tilt-perspective projection (ge::ortho::tilted) driven by a presentation-tilt that is zero on real-accelerometer platforms
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 3.0
    acceptance:
    - 'ge::ortho exposes a builder `tilted(content_rect, screen_rect, tilt) -> la::float4x4` that maps content-space into clip space with the tilt applied: rotation about an axis perpendicular to the tilt vector + perspective foreshortening + a bounding-box fit that keeps the rotated quad inside the screen. The data-dependent bbox-fit is folded into the returned matrix (not a per-vertex post-step). Non-constexpr (uses sin/cos), consistent with frameRotated. The perspective/sign convention is documented on the function (the undocumented sign is what mm2 copied wrong).'
    - 'ge exposes a *presentation tilt* distinct from gameplay gravity: a Context accessor (e.g. Context::presentationTilt()) that returns AccelSynth''s current contribution as a (gx,gy) vector, and is {0,0} whenever a real hardware accelerometer is present (AccelSynth isn''t active). Plumbed like Context::parallax() (DirectRenderHost sets it each frame from i_->synth; {0,0} when synth is nil). Consumers feed presentationTilt() straight to ortho::tilted with NO platform/source branching.'
    - 'The tilt math currently private at src/render/PlayerRender.cpp:36-81 (rotationXY Rodrigues + projectVertex: camera at z=D=2, fovY=2*atan(1/D), perspective divide; ComposeParams bbox-fit ndc''=ndc*fitS+fitT) is replaced by a call into ge::ortho::tilted so the implementations can''t drift.'
    - 'A unit test pins: the sign/axis convention, the rotated quad stays inside the screen (bbox fit), and zero tilt yields an identity-equivalent (un-tilted) projection.'
    - Direct-render consumers (multimaze2 now, tiltbuggy-on-device, the player when it returns) drop hand-rolled tilt matrices for one ge::ortho::tilted call fed by presentationTilt().
    context: |-
      Filed 2026-06-01 (multimaze2-audit); design refined 2026-06-01 in a ge session. The original framing ("extract PlayerRender's tilt math so the player and mm2 don't drift") was sharpened on three points:

      1. WRONG AXIS — the player is NOT a consumer category. The relevant axis is **hardware-accelerometer presence on the rendering platform**, a runtime property ge already decides via AccelSynth::realSensorAvailable() (real sensor -> hardware tilt; none -> AccelSynth synthesizes). The player is orthogonal: it straddles both sides depending on where it runs (device = real accel; desktop/sim = synth). "Parked, not obsolete" — T34 rewrites the player as a ge app; its tilt-composite need endures and should consume this utility, not regrow a private copy. Consumers are any direct-render tilt game on any platform, not "the player".

      2. TWO DISTINCT TILTS (the footgun) — do NOT conflate them:
         - **gameplay tilt** (gravity): real-or-synth, uniform, source deliberately hidden by AccelSynth ("invisible to the engine"). Correct as-is — one gravity path everywhere.
         - **presentation tilt** (the perspective re-projection this target builds): a SURROGATE for physical tilt. It must be applied ONLY where there is no hardware accelerometer (synth platforms). On a real device the screen is *already physically tilted in the user's hands*; re-projecting the content tilts the UI relative to an already-tilted screen — double-counted and nausea-inducing. So presentation tilt must be ZERO on real-accel platforms. A naive consumer that feeds its gameplay gravity into the projection will wrongly tilt the UI on every real device — that is the footgun this target must remove.

      3. THE GATE IS FREE — presentation tilt == AccelSynth's own contribution, which is naturally {0,0} when AccelSynth isn't active (a real sensor is present). So ge just exposes that value (zeroed on hardware) and the consumer feeds it to ortho::tilted with zero branching. No separate "is the accelerometer synthetic?" query needed; the zero falls out of AccelSynth being inactive.

      So this target is AccelSynth's render-side complement: AccelSynth normalizes tilt INPUT across platforms; ge::ortho::tilted + presentationTilt() normalize tilt PRESENTATION across consumers, with the real-vs-synth gate baked in so it can't be got wrong.

      Distinct from 🎯T9 parallax (a subtle always-on camera offset that DOES run on real devices) — not to be folded in here.

      Source-of-truth math: src/render/PlayerRender.cpp:36-81. AccelSynth's g-vector convention (the one to document/match): gx = -kG*sin(angle)*tilt.x/mag, gy = +kG*sin(angle)*tilt.y/mag, angle = mag*kTiltRadPerPixel. Not urgent (mm2 has a working local copy) but should land before/with T34 so the canonical math has a public home before the player path is restructured.
    tags:
    - multimaze-audit
    - ortho
    - tilt
    - accelsynth
    - presentation-tilt
    - T17-followup
    - T34-coupling
    origin: multimaze2-audit
    discovered: 2026-06-01
    achieved: 2026-06-01
