  T136:
    name: ge surfaces consumer-callback crashes (uncaught exceptions + fatal signals) through the app-channel logger before dying
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - The direct (device/standalone) run loop wraps the consumer callbacks (onEvent dispatched from pumpEvents, onUpdate, onRender) so an uncaught std::exception is logged with its what() and originating callback through the app-channel logger before the process exits — not a bare std::terminate with no trace.
    - A fatal-signal handler (SIGSEGV / SIGABRT / SIGBUS / SIGILL / SIGFPE) captures a minimal report — signal, and a best-effort faulting backtrace — and flushes it through the app-channel logger (and stderr) before re-raising the default handler so the OS still writes its crash report.
    - Existing SIGINT / SIGTERM graceful-quit behaviour (Signal.cpp) is preserved unchanged.
    - 'Demonstrated: a consumer that throws from onEvent (e.g. a bad tap) and one that dereferences null produce a log record retrievable via spyder app_log_get / log capture, without pulling device IPS files.'
    - Opt-out / configurable (e.g. SessionHostConfig flag or build macro) so tests and tools that expect raw aborts/asserts are unaffected; the surface is documented in one sentence at its declaration site.
    - Works on the platforms ge supports for direct mode (desktop, iOS, Android); the brokered/streaming path may already differ and is out of scope unless trivially shared.
    context: |-
      Surfaced by multimaze2 (🎯T16). Diagnosing the iPhone 13 SIGABRT (see 🎯T135) required pulling and hand-symbolicating IPS crash files off the device, because ge reports nothing itself: runDirect (ge/src/SessionHost.mm) calls onUpdate/onRender bare and DirectRenderHost::pumpEvents calls eventHandler(e) bare (DirectRenderHost.mm ~:850) — no try/catch — and installSignalHandlers (ge/src/Signal.cpp) only installs SIGINT/SIGTERM for graceful quit, not the crash signals. The try/catch blocks that exist are in the brokered/streaming path and renderBatch, not the device direct loop. So an uncaught exception (-> std::terminate -> SIGABRT) or a segfault on a consumer that has a live app-channel produces no app-channel record at all.

      Goal: when a consumer crashes inside a ge callback, ge emits a last-gasp record through the same app-channel logger spyder already drains (app_log_get / log_capture), so the developer sees the failure mode without IPS-file archaeology. Note this would NOT have caught 🎯T135 itself (that's a sokol abort() with the assert message already on stderr), but it covers the broader class — uncaught C++ exceptions and segfaults in onEvent/onUpdate/onRender — which is what was originally asked about. Tag multimaze-audit.
