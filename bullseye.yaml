    acceptance:
    - Textures are delivered as raw-RGBA mip levels, coarsest-first, populated behind a stable sg_image handle so the game and the recorded draw commands are unaware of the deferred refinement (no block compression in MVP).
    - immutable images are LOD-eligible; dynamic/stream images deliver at full rate — classified from sg_image_desc.usage with no game cooperation.
    - Meshes, buffers, shaders, and pipelines ship whole on the required channel; generic mesh LOD/decimation is explicitly not attempted (the sokol seam gives a typed blob, not safely-decimatable structure).
    - The asset-registration boundary carries a recipe handle, not just bytes, so recipe verbs (T128.7) can attach later without reshaping the asset path.
    context: Stable-handle + progressive-backing is invisible at the API level because sokol resources are handle-identified, write-only (no sg_read_image), and usage-tagged. Memory is explicitly NOT a concern — startup latency is the sole objective — so raw RGBA (universal, no transcode, no block-alignment) is the right MVP choice; coarse-mip-first nails startup latency regardless of format. Textures are the only resource big enough to gate startup and the only one with a free coarse proxy.
