  T96:
    name: RefreshRateBoost is removed from ge
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: 'Plateau P: RefreshRateBoost removal; post-P cleanup.'
    acceptance:
    - include/ge/RefreshRateBoost.h, src/render/RefreshRateBoost_apple.mm, and src/render/RefreshRateBoost_test.cpp are deleted, and removed from tools/ge-sources.mk (and any Module.mk / build references).
    - 'DirectRenderHost no longer references RefreshRateBoost: the i_->refreshRateBoost member is gone, and the press-counter wiring in pumpEvents (engagePress on FINGER/MOUSE_BUTTON_DOWN, releasePress on UP/CANCEL) plus the background drainPresses() calls are removed.'
    - 'The Android JNI hook is removed: GeActivity.java''s setFrameRateBoost / nativeOnAudioFocus-adjacent frame-rate plumbing and any nativeSetFrameRateBoost bridge are deleted.'
    - ge builds on macOS desktop + iOS + Android; all three prebuilt libge.a regenerate and verify-prebuilds.py is green; consumer apps are unaffected (nothing public depended on it).
    - 'No high-refresh regression in practice: on ProMotion the continuously-rendering ge run loop already drives the display to its max via presentation cadence; on Android VRR the display still ramps on demand. If guaranteed high refresh is ever wanted it''s pursued via the real levers (iOS Info.plist CADisableMinimumFrameDurationOnPhone; a future session-scoped Android Surface.setFrameRate), NOT a press-gated boost.'
    context: |-
      Decided 2026-06-01. RefreshRateBoost (🎯T63) holds a ProMotion/VRR display at max refresh while a touch/mouse press is in flight, to shave ~1 vsync off the first-tap-after-idle highlight latency. In review it doesn't earn its keep:

      - It is redundant under ge's architecture. The run loop renders every frame unconditionally (not on-demand), so a ge app presents drawables continuously even on a static menu — ProMotion (cadence-driven) already holds the display high, leaving no idle gap to fill. The actual lever for >60Hz on iPhone is the Info.plist opt-in CADisableMinimumFrameDurationOnPhone, not this.
      - It is mis-scoped on Android. Android VRR is hint-driven (Surface.setFrameRate); press-gating means gameplay BETWEEN taps falls back to 60Hz even on a 120Hz panel. The right granularity (if ever wanted) is a session-scoped request, not per-press.
      - It has been pure liability: it caused two app-aborting crashes — 🎯T91 (iOS Simulator, CADisplayLink shim throws) and 🎯T95 (real 60Hz iOS 26.5 devices — iPhone 13, iPad mini A17 Pro — invalid CAFrameRateRange min>max throws). Both were ge-side crashes on ALL such hardware to benefit a few ProMotion devices in an idle state.

      Conclusion (user, 2026-06-01): even a future freeze-when-static rendering mode would not warrant explicit refresh-rate control, because the display ramps back up on its own once frames resume. Delete RefreshRateBoost entirely rather than rework it. Supersedes the earlier 'make it opt-in / rework to session-scoped' idea.
    tags:
    - render
    - refresh-rate
    - ios
    - android
    - cleanup
    - removal
    - T63-reversal
    origin: manual
    discovered: 2026-06-01
