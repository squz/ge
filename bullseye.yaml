    name: ge::debug::point — fixed-perceptual-size position marker
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - ge::debug::point(la::float2|la::float3 pos, Color = magenta) queues a marker that flush() expands to a screen-space quad of fixed size kPointSizePt (pt), held constant on screen regardless of worldToClip zoom — distinct from circle()'s world-space scaling
