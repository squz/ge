      - Ship infra: T64 family is a hard dependency, not parallel work. multimaze2 is the proving ground for the unified deployment substrate. T64.7 (MinicadesKit back-port) is cross-portfolio and not on the multimaze2 critical path — excluded.
      - Audio: both T7 (background pause) and T43 (audio focus / interruption) are mobile-shipping hygiene. Reviewers flag missing handling.
