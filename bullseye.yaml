    - SokolContext::beginFrame does not create an uncommitted MTLCommandBuffer per frame; sokol_gfx's own command buffer (created and committed inside sg_commit) is the only one. The dead currentCmdBuf member and the now-unused m->queue are removed.
    - 'A ge app renders indefinitely on the iOS Simulator (far past frame 64): ticks flow continuously, CPU > 0%, and the main thread is never wedged in [MTLSimCommandQueue commandBuffer] -> semaphore_wait. Verified on iPhone 16 Pro sim: 18 then +47 ticks across reads, 4.5% CPU.'
    - sample/tiltbuggy renders a constant slow spin on the buggy as a render-liveness indicator — if it stops turning, the loop has stalled.
    - All Apple prebuilts (ios-arm64, ios-arm64-simulator) regenerated; verify-prebuilds.py green.
    context: |-
      Achieved 2026-06-01 on branch t89-sokol-cmdbuf-leak. Introduced by the T38 sokol migration: SokolContext.mm (the file that replaced BgfxContext.mm) hand-rolled `m->currentCmdBuf = [m->queue commandBuffer]` in beginFrame every frame but never used or committed it (a confused comment admitted uncertainty; sokol_gfx-Metal creates AND commits its own command buffer in sg_commit). A MTLCommandQueue allows only ~64 uncommitted command buffers; ge leaked one per frame, so beginFrame wedged in [MTLSimCommandQueue commandBuffer] -> _dispatch_semaphore_wait_slow at ~frame 64 — the app rendered ~1s then froze on the simulator (0% CPU, sleeping). bgfx never did this (it owned Metal command management internally).

      Root-caused via a live thread sample showing 871/871 samples in beginFrame->commandBuffer->semaphore_wait with paused()=false (app foreground). This is almost certainly the same wedge behind the mm2 'background watchdog' crash (🎯T88's motivating crash had the identical stack — the leak wedges regardless of foreground/background; the 600s watchdog simply noticed it while the app happened to be backgrounded) and behind 🎯T87 ('no events on tap' = the wedged loop never reaching pumpEvents). T88's background-pause is still correct and complementary (a backgrounded app shouldn't render), but it was treating a symptom, not this leak.

      Fix: removed the per-frame uncommitted command buffer and the dead queue from SokolContext.mm. After the fix the main thread blocks only in [CAMetalLayer nextDrawable] waiting on vsync (normal frame pacing), and ticks flow continuously.
    tags:
    - ios
    - simulator
    - sokol
    - T38-regression
    - metal
    - render-loop
    - surfaced-by:tiltbuggy
    origin: manual
    discovered: 2026-06-01
    achieved: 2026-06-01
  T9:
    name: ge exposes device tilt as optional parallax input to games
    status: converging
    value: 5.0
    cost: 5.0
    acceptance:
    - RunConfig has a parallaxFactor field (float, default 0)
    - When parallaxFactor > 0, the player captures Core Motion attitude and sends deltas to the server
    - Context exposes the current parallax delta (axis-angle or quaternion)
    - Baseline auto-settles via EMA so sustained tilts become the new neutral
    - A sample game demonstrates the effect
    context: |-
      Reproduce the Apple Spatial Scenes effect: games can tilt their scene in response to device tilt. The player reads Core Motion attitude (quaternion), maintains a baseline via exponential moving average (lerp with α = 1 - exp(-dt/τ), no normalisation needed — tiny steps keep magnitude near unit), and sends the delta between current and baseline to the server.

      Games opt in via RunConfig.parallaxFactor (float, 0 = off, >0 scales the effect). Context exposes the current parallax via ctx.parallax(). The game decides which parts of the scene to adjust — typically camera or world layers, not UI.

      **Why parallaxFactor is a float (decided 2026-04-13)**: one number controls both opt-in and sensitivity. The player sees `parallaxFactor > 0` and starts the Core Motion pipeline; the engine scales the delta by that factor before Context::parallax() returns it. Collapses what would otherwise be three things (bool to enable + float for sensitivity + opt-in signal to the player) into one. A bool would force games to multiply themselves and force a separate enable flag; an enum would be too coarse for art-direction tuning.

      **Why CMDeviceMotion.attitude, not raw accelerometer or raw gyroscope (decided 2026-04-13)**: gravity alone misses rotation around the vertical axis (twisting an upright phone left/right barely changes the gravity vector but is a real orientation change a game might want to surface). Raw gyroscope rotation rate would require manual integration and accumulates drift. Core Motion sensor-fuses gyro + accel and exposes absolute orientation as a quaternion — drift-free, captures vertical-axis twist correctly, no integration to hand-roll. The baseline is then an EMA of that attitude quaternion; delta = inverse(baseline) * current.
    origin: user request
    discovered: 2026-04-15
