  T131:
    name: ge apps can suspend rendering while the scene is static, so a still screen costs ~no GPU/encode/present work
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'ge ASSEMBLES the "render this frame?" decision from declared sources — edges (requestRedraw(), coalescing) and levels (addRenderTrigger()) — so a consumer gets render-on-demand with little-to-no app-side bookkeeping and NEVER writes central "turn rendering on/off" logic. (mechanism: T131.1)'
    - 'A static screen costs ~no GPU / present / battery: presents fall to ~0/sec, measured via Context::framesPresented() on desktop + iOS + Android, and resume on the first input / redraw on the very next frame with no dropped interaction. (T131.5)'
    - 'The common change sources are zero-effort: ge ships triggers for physics sleep + its own animations (T131.2) and its interactive widgets self-invalidate on transitions (T131.3); discrete-state screens (menus) idle via a cheap State diff with no render-control code (T131.4).'
    - Opt-in and backward compatible (non-adopters keep rendering every frame); works on desktop, iOS direct-mode, and Android direct-mode; the opt-in surface is documented in one sentence at each declaration site (RunConfig / Context).
    - 'Brokered streaming quiet-when-static is EMERGENT, not built here: the static detection is engine-side and runs in the server''s loop, so a server on the render-on-demand path stops encoding/emitting H.264 when static and the player holds the last frame. The only streaming-specific addition is forcing an IDR/keyframe on the first post-idle frame so a drifted held frame re-syncs. Tracked under T34 (brokered/wire path), gated on that path coming alive — NOT a child of T131.'
    - Achieved when T131.1–T131.5 are achieved.
    context: |-
      Realises the "future freeze-when-static rendering mode" referenced (but explicitly deferred) in 🎯T96's removal decision (2026-06-01): the run loop renders every frame unconditionally, so a ge app presents drawables continuously even on a static menu. Surfaced concretely by multimaze2: its menu / level-picker / solved-level screens are genuinely static yet redraw at full refresh — needless GPU and battery/thermal cost on the iOS launch target (multimaze2 🎯T16, 🎯T66).

      Design settled with the user 2026-06-30 and decomposed into the T131.* subgraph. The spine is T131.1: ONE redraw bit raised two ways — imperatively via requestRedraw() (edges: discrete transitions, coalescing, callable any number of times per frame from any thread with no central collector) and declaratively via addRenderTrigger(pred) (levels: sustained activity ge polls and auto-raises the bit while true). An active/idle state machine blocks the loop (~0% CPU) when no trigger is true and no edge is pending; an edge wakes it, and a trigger started by that frame keeps it active until the activity settles. On top of the spine: built-in physics/animation triggers (T131.2), widget self-invalidation (T131.3, pulled up out of this node's old prose), and a State-diff tier for discrete screens (T131.4). T131.5 makes "presents → ~0/sec" measurable (a present counter at the T101 Pass chokepoint) and proves it in-repo (tiltbuggy on box2d sleep) cross-platform (app-channel + spyder matrix).

