    name: RefreshRateBoost on iOS Simulator doesn't throw at CADisplayLink.preferredFrameRateRange
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 1.0
    acceptance:
    - A consumer app running on the iOS Simulator does not abort on the first SDL_EVENT_MOUSE_BUTTON_DOWN (non-touch-synthetic) — RefreshRateBoost engageBoost() either no-ops on simulator or guards the preferredFrameRateRange call with a try/catch
