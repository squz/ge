  T99:
    name: ge offers an opt-in ge::app&lt;App&gt; wrapper binding a State-first App class to the run loop, with optional fixed-step simulation
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: 'Plateau P: ge::app wrapper; R5 API ergonomics.'
    acceptance:
    - include/ge/app.h provides ge::app<App>(State&, LoopOpts={}) returning a ge::Factory that wires an App's conventionally-named methods to RunConfig callbacks via C++20 concept detection; State is always the first parameter
    - An App declaring step(State&, const Input&, float dt) is driven by a fixed-timestep accumulator (dt = 1/tickHz, constant) with double-buffered prev-state and an interpolation alpha handed to render; an App declaring only update/render runs variable-rate with no accumulator and no copyability requirement
    - Optional event/shutdown (and back-press/memory-warning) are wired only when the App declares them
    - ge::Input is a serializable per-tick input batch (pointer/key edges + held continuous samples like tilt) usable as the unit a future input-replay system records
    - At least one sample (tiltbuggy) is migrated to the wrapper and its main() collapses to a single ge::run(ge::app<App>(state)) line
    - Documented in CLAUDE.md Public API
    context: 'Design discussion 2026-06-02/03 distilling Unity''s data-flow (DOTS) turn into a lightweight, opt-in wrapper for ge: take the data-flow philosophy (pure serializable State, deterministic stateless step, read-only view, tooling on top — replay/snapshot/agent-testing) WITHOUT the data-oriented machinery (ECS/archetype storage/job system) that ge''s entity counts don''t justify and that sank DOTS adoption. The wrapper also removes the current factory boilerplate (three forwarding lambdas with inconsistent state-parameter ordering). Fixed step uses rigid-constant dt + render interpolation (determinism), dt passed as a plain float (matches physics-engine convention; the loop guarantees constancy, so no newtype). View-only animation state lives on the per-session App, not in State. Composes with T92''s app-channel state registry (snapshot/restore) and time-control (pause/step/speed). Not yet scoped against the prebuilt-libs tax (header-only adapter, so likely none). Lower priority than the multimaze-audit frontier.'
