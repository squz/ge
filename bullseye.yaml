    name: AccelSynth consumes mouse button + finger events while shift is held
    status: set_aside
    value: 0.0
    cost: 0.0
    set_aside_reason: 'Plateau P: AccelSynth shift+drag; post-P input polish.'
    acceptance:
    - While shift is held on desktop or iOS Sim, ge::AccelSynth::handle returns true for SDL_EVENT_MOUSE_BUTTON_DOWN, SDL_EVENT_MOUSE_BUTTON_UP, SDL_EVENT_FINGER_DOWN, SDL_EVENT_FINGER_UP — not just SDL_EVENT_MOUSE_MOTION — so the consumer’s onEvent never sees the press/release pair that would otherwise start a game gesture.
    - Mouse / finger button events with NO shift held continue to pass through unmodified.
    - 'Shift state transition while a press is in flight: pressing shift during a non-tilt drag finishes the drag (events keep flowing to consumer until the press lifts); releasing shift during a tilt-drag ends the tilt and from that point events flow through normally.'
    context: 'Found 2026-06-01 while debugging multimaze2 shift-drag interactions on the desktop/sim build.\n\nCurrent behaviour: AccelSynth.handle consumes the Shift key event and consumes MOUSE_MOTION while shift is held, but it does NOT consume MOUSE_BUTTON_DOWN / MOUSE_BUTTON_UP. So the consumer (game) sees the press / release pair but no motion in between, and any ‘tap-and-flick’ fallback in the consumer fires on the start→end cursor positions even though the user''s intent was ‘tilt gravity’.\n\nConcrete repro: multimaze2 playing screen, hold shift, click+drag the mouse left or right. Gravity tilts correctly (balls roll), but mm2''s swipe-between-levels gesture also fires because the press/release made it through. Two intents interfere on one input gesture.\n\nFix: make AccelSynth.handle return true for SDL_EVENT_MOUSE_BUTTON_DOWN / UP and SDL_EVENT_FINGER_DOWN / UP whenever shiftDown_. The press is part of the tilt gesture; the consumer never needed to see it. (Today''s design implicitly assumed mouse motion was the only thing that mattered, which is true for the gravity calc but not for stealing the gesture from the consumer.)'
