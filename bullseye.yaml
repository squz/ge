  T120:
    name: Direct-mode iOS apps follow device rotation without a per-consumer SDL_HINT_ORIENTATIONS dance
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'Default direct-mode iOS app behaviour: UIWindow orientation follows the Info.plist''s UISupportedInterfaceOrientations (and free-rotates on iPad when multiple are allowed) WITHOUT the consumer having to set SDL_HINT_ORIENTATIONS before ge::run'
    - Documented in ge/CLAUDE.md under 'iOS orientation lock' so consumers know what the engine handles for them
    - Existing SessionHostConfig.orientation lock behaviour is preserved
    - tiltbuggy continues to lock to landscape via its kOrientationAnyLandscape request
    context: |-
      Surfaced by the esfera2 sokol port (esfera2-audit). SDL3's UIKit_GetSupportedOrientations in vendor/.../SDL_uikitwindow.m falls back to inferring the orientation mask from the SDL_Window's floating w/h when SDL_HINT_ORIENTATIONS is unset AND the window is not marked SDL_WINDOW_RESIZABLE:

        if (orientationMask == 0 && (window->flags & SDL_WINDOW_RESIZABLE)) {
            orientationMask = UIInterfaceOrientationMaskAll;
        }
        if (orientationMask == 0) {
            if (window->floating.w >= window->floating.h) orientationMask |= UIInterfaceOrientationMaskLandscape;
            if (window->floating.h >= window->floating.w) orientationMask |= (Portrait | PortraitUpsideDown);
        }

      A consumer passing the natural-looking SessionHostConfig {.width = 1024, .height = 768} gets silently locked to landscape on iPad — the Info.plist's permissive set is ignored because SDL never asks UIKit for portrait. The fix as a consumer is to call SDL_SetHint(SDL_HINT_ORIENTATIONS, "Portrait LandscapeLeft LandscapeRight") before ge::run, but that's a footgun every direct-mode iOS app will trip until ge handles it.

      Suggested approaches (pick one):
      1. In DirectRenderHost / SokolContext on iOS, set SDL_HINT_ORIENTATIONS at startup from the Info.plist's UISupportedInterfaceOrientations entries (NSBundle lookup, format as the space-separated string SDL expects). Zero consumer surface; honours the plist as the source of truth.
      2. Open the SDL window with SDL_WINDOW_RESIZABLE on iOS. Trips SDL's "any orientation OK" branch. Risk: may interact with multitasking / Split View behaviour.
      3. Expose a SessionHostConfig.iosOrientations bitmask consumers fill in. More explicit but more API surface; (1) is the better default.

      Companion: esfera2 commit c48e5da on branch upgrade-ge-v0.61 sets the hint locally as a workaround until this lands.
