  T133:
    name: Android swapchain provides a depth buffer (Vulkan + GLES3) so depth testing works
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    acceptance:
    - 'The Android swapchain pass exposes a real depth(-stencil) attachment on BOTH backends: SokolContext_android sets desc.environment.defaults.depth_format and pass.swapchain.depth_format to a concrete format (e.g. SG_PIXELFORMAT_DEPTH or DEPTH_STENCIL), not SG_PIXELFORMAT_NONE; the GLES path requests SDL_GL_DEPTH_SIZE>=24 (currently 0); the Vulkan path (VkM) creates a per-frame/per-image depth VkImage+view and binds it into the sokol swapchain descriptor.'
    - A pipeline with depth.compare=LESS_EQUAL + depth.write_enabled correctly occludes later-submitted geometry behind nearer earlier-submitted geometry on-device, on a Vulkan device (Mali-G710) and on a GLES3 fallback device.
    - esfera2 (opaque pieces drawn first, then translucent two-pass cells) renders pieces in front of the cells when the piece is nearer the camera — pieces no longer vanish when rotated from the silhouette to the front of the sphere.
    - The depth attachment is recreated on swapchain resize / device rotation (no stale-extent depth image).
    - tiltbuggy still renders correctly on Android (no regression).
    context: 'esfera2 ge v0.64 port (esfera2-audit). On Android, ge''s SokolContext_android creates the swapchain with no depth buffer on both paths: GLES sets SDL_GL_SetAttribute(SDL_GL_DEPTH_SIZE, 0) and depth_format=SG_PIXELFORMAT_NONE (lines ~135/160/206); the custom Vulkan backend (VkM) also sets depth_format=SG_PIXELFORMAT_NONE (~302/676) and its swapchain only tracks color images/views. With no depth attachment, any pipeline requesting depth.compare/write gets a no-op depth test. tiltbuggy is a single convex back-face-culled globe, so it never needed depth and the gap was invisible. esfera2 is the first consumer that depth-tests opaque geometry (chess pieces) against translucent geometry (the two-pass sphere cells): on a Pixel Tablet (Vulkan, Mali-G710) the opaque pieces are only visible where they extend past the sphere silhouette (against black); rotated to the front they are painted over by the later-drawn translucent cells because submission order, not depth, decides. iOS/desktop (Metal) have a swapchain depth buffer, so the same code is correct there. Vulkan NDC z is [0,1] like Metal, so the existing [0,1] projection is fine — the missing piece is purely the depth attachment.'
