    actual_cost: 2.0
    acceptance:
    - 'In on-demand mode (Context::setContinuousRendering(false)), a continuous SDL_EVENT_SENSOR_UPDATE stream does NOT by itself force a render each frame: the run loop stays idle (~0% CPU, onRender skipped) until genuine user input (touch/key/mouse) or requestRedraw().'
    - A consumer that wants sensor-driven redraws can still get them by opting in explicitly (calling requestRedraw() from onEvent on sensor updates), OR ge exposes a runtime sensor enable/disable so the consumer can pause the sensor on a static screen. Pick one; document it.
    - 'Verified on a physical iPhone with multimaze2 (which keeps kSensorAccelerometer enabled session-wide for the Playing screen): its Menu/Levels idle to ~0 fps while static, with measurably lower CPU/GPU than continuous mode.'
    - 'Backward compatible: continuous-mode consumers, and on-demand consumers that DO want sensor-driven redraws, are unaffected.'
    context: |-
      Surfaced by multimaze2 🎯T66 (consumer-side render-on-demand adoption, on ge 0.68 / 🎯T132). T66's implementation is correct (setContinuousRendering(false) on static Menu/Levels) and idles on desktop, but does NOT idle on a physical device.

      Root cause: DirectRenderHost::pumpEvents (ge/src/render/DirectRenderHost.mm) sets `sawRealEvent = true` (line ~729) for EVERY non-sentinel SDL event — including SDL_EVENT_SENSOR_UPDATE (the accelerometer, handled at ~816) — then calls `i_->ctx->markRedraw()` (line ~850) whenever sawRealEvent. The render-on-demand gate in SessionHost.mm (~114) only skips the frame when `!continuousRendering() && !takeRedraw()`, so a marked redraw forces a render. An always-on accelerometer therefore marks redraw on every sample, rendering continuously on a static screen and defeating the on-demand skip.

      No app-side workaround exists: sensors are opened once in the DirectRenderHost ctor from SessionHostConfig.sensors with no runtime enable/disable (comment at DirectRenderHost.mm:641), and markRedraw fires inside ge's pumpEvents before the app's onEvent runs, so the consumer can neither pause the stream nor suppress the redraw.

      Recommended fix (a): do NOT markRedraw on SDL_EVENT_SENSOR_UPDATE — a continuous sensor stream isn't discrete user input demanding a frame; a consumer that wants sensor-driven redraws opts in via requestRedraw() in onEvent. Cleaner and needs no new API. Alternative (b): add a runtime sensor enable/disable so the consumer pauses the accelerometer on static screens.

      Tag with multimaze-audit; this blocks the on-device half of multimaze2 🎯T66.
    tags:
    - render
    - run-loop
    - render-on-demand
    - sensors
    - accelerometer
    - power
    - ios
    - multimaze-audit
    - blocker
    origin: manual
    discovered: 2026-06-30
    achieved: 2026-06-30
  T135:
    name: ge::Sprite owns its GPU resources (RAII) so re-rasterizing a sprite can't leak the sokol pool
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'ge::Sprite frees its underlying sg_image + sg_view on destruction AND on (move-)assignment: reassigning a slot (e.g. `m->badge = rasterizeSvg(...)`) destroys the previous image/view instead of orphaning them.'
    - ge::Sprite is move-only (or otherwise prevents double-free of the shared sokol handles); all in-tree Sprite producers and by-value users are migrated to the new ownership semantics and still compile/behave.
    - rasterizeSvg / rasterizeText / uploadPixels (and any other Sprite factory) return owning Sprites consistent with the new semantics.
    - 'Soak/counter test: repeatedly re-rasterizing the same Sprite slot for >1000 iterations does NOT grow the live sokol image/view counts (pools are image=128, view=256) and never trips the sg_make_image/sg_make_view pool-exhaustion assert.'
    - Resolves multimaze2's SIGABRT — a sokol pool-exhaustion assert in _sg_init_view / sg_make_view reached via ge::rasterizeSvg <- Application::renderMenu — confirmed on the iPhone 13 (build 115).
    - Destroys happen on the render/sokol thread (where reassignment occurs); no cross-thread sg_destroy_*.
    context: |-
      Surfaced by multimaze2 (🎯T16 v1 / iPhone 13 launch device). Sporadic SIGABRT crashes, tap-correlated. Root-caused 2026-06-30 from the device IPS crash report (symbolicated): EXC_CRASH / SIGABRT, byProc MultiMaze, faulting main-thread stack `__assert_rtn -> _sg_init_view(.cold) -> sg_make_view -> ge::rasterizeSvg -> Application::renderMenu`. It's a sokol_gfx pool-exhaustion assertion, not an event-handler bug — tapping just navigates, and re-entering the menu re-renders it.

      Mechanism: ge::Sprite (ge/include/ge/sprite.h) is a plain POD — `sg_image tex` + `sg_view view`, no destructor, no resource-freeing assignment. ge::rasterizeSvg -> uploadPixels (ge/src/svg.cpp) calls sg_make_image + sg_make_view every time and frees nothing. So every render-path re-rasterization — multimaze2's paidStarSprite[i] (per price-label change), buyBarSprite, levelsBuySprite, menuButton (per resize) — orphans the prior image+view. Sokol pools are small (image 128 / view 256); after enough re-rasterizations a pool fills and the make-resource call asserts -> abort. Sporadic because it depends on how many re-rasterizations accumulate before the ceiling.

      This is exactly the secondary finding already logged in multimaze2 🎯T47's context ("ge::Sprite has no RAII — reassignments like m->buyBarSprite = ge::rasterizeSvg(...) and m->paidStarSprite[i] = ... orphan the previous sg_image/sg_view on every price/pack change (~1 MB GPU each; bounded but real)") — except it is NOT merely bounded GPU waste; it crashes once a pool fills. Per-user direction the fix goes in ge properly (no app-side mitigation). Tag multimaze-audit.
