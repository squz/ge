  T131.1:
    name: 'Render triggers + active/idle state machine: ge assembles "render this frame?" from edges and levels'
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Context::addRenderTrigger(pred) registers a level predicate; in render-on-demand mode the run loop renders every frame while ANY registered trigger returns true, and blocks (idles, ~0% CPU) only when all triggers are false, no redraw is pending, and no resuming input has arrived.
    - Triggers are polled cheaply each loop iteration (a predicate call, no onUpdate/onRender) so the active-vs-idle decision needs no frame work; the expensive onUpdate/onRender run only on frames that actually render.
    - 'The active->idle transition still draws the final settled frame: triggers are evaluated on the state the previous onUpdate produced, so the frame that ENDS an activity is itself rendered and no trailing/settle frame is dropped.'
    - 'requestRedraw() coalesces: any number of calls per frame, from any thread or callback, collapse to exactly one render of the next frame with NO central collection code; the SDL wake event is pushed only on the false->true transition of the redraw flag (one wake per render cycle).'
    context: 'The engine mechanism the whole convenience story rests on. One redraw bit, two ways to raise it: imperatively via requestRedraw() (edges — discrete transitions) and declaratively via addRenderTrigger(pred) (levels — sustained activity ge polls and auto-raises the bit while true). The active/idle state machine: an edge wakes a blocked loop and draws one frame; if that frame starts an activity its trigger holds the loop ACTIVE until the activity settles, then back to IDLE. Triggers can only keep-active and decide-when-to-settle (they can''t wake a blocked loop, which only an edge can); that asymmetry is why both primitives are needed. Settled 2026-06-30 with the user.'
