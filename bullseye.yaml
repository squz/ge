        3. multimaze2 ships through `make ship-release VERSION=x` and gets accepted (or at minimum submitted) to App Store Connect — the cross-repo proof that the full T64 substrate works end-to-end.

      Until those land, T69 stays `converging`. The ge PR retires the 16 deps independently; T69 retires when multimaze2 actually submits.

      Scope decisions made during the 2026-05-24 conversation:
      - Platform: iOS App Store only at first release. No Android, no desktop. Drops T39 (Android emu vulkan colour swap), T50.1 (Android adaptive icon split), T64.6's Android-CI half.
