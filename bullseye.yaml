  T92:
    name: ge implements the app side of spyder's bidirectional MessagePack RPC channel
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - '**Connect + handshake**: when ge sees a LOG_TARGET pointing at a spyder app_channel listener (see scheme question in context), it dials over TCP, sends a `hello` request advertising app_name (consumer-set), app_version, and the methods ge has handlers for. Awaits the `accepted_methods` ack before considering the channel live.'
    - '**Framing**: length-prefixed MessagePack frames (4-byte LE length, then body, max 16 MB). Envelope is JSON-RPC-shaped: `{id, method, params}` requests, `{id, result|error}` responses, `{method, params}` async pushes. msgpack-c (or equivalent) handles encode/decode; no hand-rolled MessagePack.'
    - '**Lifecycle methods (ge owns)**: `ping` (returns server-arrival ts), `quit` (acks then enqueues SDL_QUIT — exit code 0, no macOS crash notification), `flush` (drains log/perf sender queues, acks when done), `backgrounded`/`foregrounded` (post platform lifecycle notification — UIApplicationWillResignActive analog / onPause), `low_memory_warning` (post UIApplicationDidReceiveMemoryWarningNotification / onTrimMemory).'
    - '**Time-control methods (ge owns)**: `pause` (set paused flag; dt becomes 0; render and input handling continue), `resume` (clear paused), `step` (advance N frames then re-pause), `speed` (set dt multiplier). One-time main-loop pacing change in the SessionHost/run loop.'
    - '**Input injection (ge owns)**: `input_inject` for finger_down/up/motion (normalized 0–1 coords), key_down/up, accel — fabricate SDL_Event and call SDL_PushEvent. All paths land in the consumer''s event() handler indistinguishably from real OS events.'
    - '**State + serialization (consumer extends)**: ge ships a registry where consumers register slice-getters (`registerStateSlice("scene", []() -> json/MessagePack { ... })`) and save/restore handlers (`registerStateSerializer(saveFn, restoreFn)`). `state_query`, `save_state`, `restore_state` route through the registry. Sample tiltbuggy registers a couple of slices as the proving ground.'
    - '**Screenshot (ge owns)**: `screenshot_app` triggers framebuffer readback (Metal MTLBlitCommandEncoder for Apple, glReadPixels for GLES on Android), PNG-encodes (existing dependency), responds with `{format: "png", width, height, data: <bin>}`. The PNG bytes ride as MessagePack `bin` — no base64.'
    - '**Push messages (ge owns)**: structured `log` push replaces the current NetworkLogSink text emission (level, subsystem, format, args sent as a typed message instead of formatted text); periodic `perf` push (default 1s cadence) carrying frame_ms + custom counters consumers register via `perfEmit(name, value)`.'
    - '**Dev-only compile gate**: the entire client (connect, framing, dispatcher, all handlers) is gated behind #ifndef NDEBUG (or ge''s existing debug-build macro). Release builds compile the feature out completely — no msgpack symbols, no socket, no handler table. Same gate as the existing T83 NetworkLogSink.'
    - '**Verified end-to-end against spyder ≥0.53.0**: a sample consumer (tiltbuggy or a minimal `sample/appchannel-demo/`) runs against a spyder app_channel listener. The agent drives `app_ping` → `app_pause` → `app_input` (tap) → `app_state` (slice query) → `app_screenshot` → `app_quit` and the app responds correctly to each on macOS desktop, iOS (simulator + device), and Android. Logs and perf counters flow through `app_log_get` / `app_perf_get`.'
    - '**Documented in ge''s agents-guide**: the connect/hello flow, the LOG_TARGET scheme decision (see context), how consumers register state slices / serializers / perf counters, the per-platform readback story for screenshot_app, the dev-only compile gate.'
    context: |-
      Pairs with spyder T75 (shipped as spyder v0.53.0 — bidirectional MessagePack RPC channel, full v1 method set: 20 app_* MCP tools, 14 sub-targets retired). Spyder is the host; ge is the in-app client that gives the methods something to dispatch into.

      Why this matters: turns spyder's app_* tool surface from "you could drive an app if it implemented the protocol" into "every ge-based game is agent-drivable by default" — multimaze2, tiltbuggy, esfera2, yourworld2, future apps. The single biggest debugging-mode unlock is input_inject (eliminates the entire "did the tap reach my handler" investigation that consumed multimaze2 hours), with quit (no macOS crash notifications) and pause/step (frame-by-frame visual debugging) close behind.

      LOG_TARGET scheme decision (resolve early): spyder ships two distinct TCP families — log_collect_* (raw newline text, v0.51) and app_channel_* (MessagePack RPC, v0.53). Both want a way for the app to know where to dial. Options for ge to surface:
        (a) Single LOG_TARGET env, URL-scheme on the value: `host:port` (text, current) vs `appchannel://host:port` (RPC). One env var, scheme picks protocol.
        (b) Separate env vars: LOG_TARGET (text) and SPYDER_APP_CHANNEL (RPC). Each unambiguously names one path.
        (c) Single LOG_TARGET, autodetect protocol from peer behaviour. Reject — adds latency and ambiguous error modes.
      Recommendation: (a). Same env var, scheme as type discriminator. Easier to document, app-side parser stays in one place.

      Backwards compat with T83: the existing text-only NetworkLogSink (host:port, no scheme) keeps working unchanged — that's the `nc -l <port>` debug-without-spyder workflow. The new appchannel client is purely additive.

      Consumer cooperation needed: state_query, save_state/restore_state, and perf counters all depend on consumers registering their own slices / serializers / counters. ge provides the registry + the wire dispatch; consumers populate it. Sample tiltbuggy registration is part of the deliverable so future ge apps have a copyable pattern.

      Pairs with T83 (NetworkLogSink — the simpler-protocol cousin that landed first).
    depends_on:
    - T92.1
    - T92.2
    - T92.3
