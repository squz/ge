  T83:
    name: ge's log layer offers a TCP network sink for dev-time diagnostics that bypasses Apple unified logging and Android logcat
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 3.0
    acceptance:
    - ge::log::install() checks getenv("LOG_TARGET") at startup. When set to host:port, a network log sink is appended to the default logger so every spdlog emission is also sent over TCP.
    - When the env var is unset or empty, no sink is installed and behaviour is unchanged.
    - '**Android fallback**: where getenv can''t reach the app (Activity-launched, no shell inheritance), ge also reads the `debug.ge.log_target` system property via the standard Android property API. Both mechanisms feed the same resolveLogTarget() lookup. Set with `adb shell setprop debug.ge.log_target <host>:<port>`.'
    - 'The sink-install code is compile-gated behind #ifndef NDEBUG (or ge''s existing debug-build macro). Release builds compile the entire feature out — no getenv call, no symbol references — so the convention can''t accidentally leak into a TestFlight or Play Store binary.'
    - 'Reconnect-on-error: if the listening host disconnects mid-session, the sink reconnects with backoff rather than going silently dead. spdlog 1.x''s stock tcp_sink does *blocking* reconnect on the calling thread and would block the render loop — ge ships a bespoke NetworkLogSink with a sender thread and bounded drop-oldest queue.'
    - 'Verified end-to-end on macOS desktop, iOS (simulator or device), and Android (emulator or physical device): the app emits via SPDLOG_INFO, lines arrive at the listener within ~100ms, no Apple-log / logcat dependency in the path.'
    - '**Spyder integration documented**: ge''s docs and the sample/tiltbuggy snippet explicitly show the spyder log_collect_* workflow as the preferred recipe for device-driven LAN streaming — `log_collect_start` allocates a port (random, no more 9999 placeholder), returns the LAN host candidates, and the caller passes one of those host:port pairs as LOG_TARGET in a subsequent spyder launch_app / deploy_app env. The bare `nc -l 9999` recipe stays as the no-spyder fallback for desktop/Xcode-scheme launches but is no longer the headline example.'
    - 'agents-guide.md documents the LOG_TARGET convention, the spyder log_collect path, the Android property fallback, the #ifdef guard, and the per-platform injection mechanisms (desktop shell env, iOS Xcode scheme env or spyder launch passthrough, Android setprop or spyder launch passthrough).'
    context: |-
      Re-opened 2026-06-01 (was achieved earlier the same day in branch t83-tcp-log-sink, not yet merged). The bulk of the work is done — NetworkLogSink, resolveLogTarget, compile gate, three-platform runtime verification all shipped against the branch. Two cleanup items remain before merge:

      1. Env-var name: the acceptance text said SPYDER_LOG_TARGET (drafted before the LOG_TARGET / SPYDER_LOG_TARGET / GE_LOG_TARGET discussion landed on un-namespaced LOG_TARGET). The actual implementation in src/log.cpp uses LOG_TARGET — matching the convention. Acceptance text was just stale; refresh to match what shipped.

      2. Spyder log_collect_* integration: spyder v0.51.0 (released 2026-06-01) ships log_collect_start / _get / _stop / _list — a host-side TCP listener that allocates a random kernel-assigned port and returns the laptop's LAN-reachable host candidates. The intended workflow is:

             log_collect_start         -> {port, hosts}
             deploy_app env={LOG_TARGET: host:port}
             log_collect_get / _stop

         ge's docs (agents-guide.md, sample/tiltbuggy/src/main.cpp) still use the bare `nc -l 9999` recipe everywhere. That recipe is still valid for the no-spyder cases (desktop dev, Xcode-scheme env, adb setprop), but it shouldn't be the headline — the spyder path is one tool call away and removes the "pick a port that won't collide" guesswork. Reframe the docs accordingly before merging the t83-tcp-log-sink branch.

      The NetworkLogSink design choices (sender thread, bounded drop-oldest queue, exponential backoff 250ms→5s) all stay — the implementation is correct, only the doc framing and the acceptance prose need updating.

      Pairs with the spyder env passthrough target (T73, shipped in spyder v0.50.0) and the new spyder log_collect_* family (v0.51.0).
