  T124:
    name: ge apps render a given State headlessly to a PNG via a one-shot `render` CLI (single + `--batch`) — no device, ged, or spyder in the loop
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    acceptance:
    - 'ge ships a headless render path — `ge::renderToPng` / `ge::renderBatch` (SessionHost.h) build a hidden-window DirectRenderHost (SokolConfig.hidden -> off-screen drawable, framebufferOnly=NO) whose swapchainPass() renders one frame and reads the framebuffer back to a PNG via captureFrameRGBASync + ge::writePng. The consumer''s onRender is byte-identical; only the host visibility + capture differ. (Implemented as a hidden DirectRenderHost rather than a separate offscreen-only SokolContext / third RenderHost: the hidden window still vends a Metal drawable and reuses captureNextFrame wholesale — less code, verified working.)'
    - 'A consumer binary exposes `render --state <file|-> --out <png> [--size WxH]`: it deserialises State via the app''s registerStateSerializer restore, renders one frame headlessly, writes the PNG, and exits 0 — with no ged, no SPYDER_APP_CHANNEL, and no device. (Per-request determinism-override flags --pixel-ratio/--safe-area/--tilt/--seed are deferred; determinism is achieved without them — see context.)'
    - '`render --batch <manifest>` renders a [{state,out}] corpus in one fresh process (amortised host + factory). A failing/throwing fixture is reported as a failure, not a dead run (per-item try/catch); a `--isolate` flag re-execs the single-render path per fixture for hard-crash isolation. Verified: a batch-rendered frame is byte-identical to a fresh single render of the same State (no state leak across items).'
    - 'Renders are deterministic: same State + same size yields a byte-stable PNG (verified byte-identical across separate processes). Render-liveness animation is gated behind a flag the render path disables (tiltbuggy Renderer::setDiagnosticSpin(false)); the static scene carries no tilt/parallax/RNG nondeterminism. Size is overridable per request via --size; tilt/seed/pixel-ratio/safe-area per-request overrides deferred.'
    - 'A documented fixtures + imgdiff regression loop exists (render corpus -> diff against golden -> report), with tiltbuggy as the in-repo proof: committed fixtures/{default,tilted,pro}.json + manifest, small 320x240 committed goldens (test/refs/ convention), and `make render-test` (batch-render + bin/imgdiff RMS-threshold each vs golden) / `make update-render-goldens`.'
    - 'Documented in CLAUDE.md + AGENTS.md Public API (renderToPng/renderBatch/writePng) and agents-guide.md (the agent debug workflow: render a fixture or constructed State to a PNG on the dev box with no device involved).'
    context: |-
      Design discussion 2026-06-21/22 (this session). Today an agent validating a code change by inspecting a specific app state must run on a device, navigate into that state, and screenshot via spyder — high friction. This target makes producing the frame a one-shot, hermetic CLI call on the dev box.

      Architecturally it is a *headless RenderHost variant*: DirectRenderHost presents, ServerWireBridge encodes+transmits, this one renders offscreen and reads back to a PNG — the consumer's onRender is byte-identical; only the host differs. It reuses ge's existing machinery: registerStateSerializer save/restore (T92/T115 — the same pair behind app_save_state/app_restore_state), SokolContext::captureNextFrame (T92.6 readback, which already powers app_screenshot), the vendored stb_image_write, and bin/imgdiff (ImageDiff.h).

      CLI, not a server, by deliberate decision: agentic debugging recompiles every iteration, so a long-running server is perpetually stale and must be restarted each loop — the CLI re-execs the freshly-built binary, guaranteeing "what I render is what I just compiled," plus crash isolation, zero lifecycle, and CI parity. Regression needs no server either: a known corpus -> `render --batch` in one fresh process amortises startup while staying hermetic.

      Depends on T99: "all apps, to the extent possible" needs render = f(serializable State). MVP works today for any app that already implements a real registerStateSerializer restore — the full T99 wrapper is not strictly required.

      SHIPPED (v0.62.0, branch t124-headless-render): the "third RenderHost / offscreen-only SokolContext" of the original acceptance became "DirectRenderHost in a hidden window + synchronous framebuffer readback" — a hidden SDL window still vends a Metal drawable, so this reuses all of SokolContext + captureNextFrame (framebufferOnly=NO in dev builds) with no new context type. Engine surface: SokolConfig.hidden, ge::writePng (png.cpp, owns STB_IMAGE_WRITE_IMPLEMENTATION), captureFrameRGBASync (DirectRenderHost.mm), renderToPng/renderBatch + RenderItem (SessionHost.mm). Consumer proof: sample/tiltbuggy `render` verb (--state/--out/--batch/--isolate/--size), Scene::applyPose, Renderer::setDiagnosticSpin, fixtures/ + render.mk golden loop. Deferred to a future target if a consumer needs it: per-request determinism-override flags (--pixel-ratio/--safe-area/--tilt/--seed); the visual-fidelity gap for apps not yet on the T99 data-flow shape; an optional MCP `render_state` tool that execs the CLI fresh per call.
    depends_on:
    - T99
