    acceptance:
    - First touch on a real iOS 17/26 device (iPad mini A17 Pro, iPhone 13 etc.) does not abort the consumer app with `-[CADisplayLink setPreferredFrameRateRange:]` ObjC exception.
    - engageBoost either guards the call with @try/@catch and logs once on failure, or validates the CAFrameRateRange (e.g. ensures display.maximumFramesPerSecond > 0) before calling the setter, or is short-circuited on OS / device variants known to throw.
